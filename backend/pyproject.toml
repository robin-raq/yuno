[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuno-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<1",
    "httpx-sse>=0.4,<1",
    "sse-starlette>=2.1,<3",
    "python-dotenv>=1.0,<2",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=21,<22",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires a running Goose ACP server and ANTHROPIC_API_KEY",
]
